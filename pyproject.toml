[project]
name = "pose-pipeline"
version = "0.1.0"
description = "Mouse and lockbox reconstruction pipeline"
requires-python = ">=3.10,<3.11"

dependencies = [
    "torch==2.3.1",
    "torchvision==0.18.1",
    "torchaudio==2.3.1",
    "opencv-python>=4.9.0",
    "pyzmq>=25.1.0",
    "numpy>=1.26.0,<2.0",          # DLC needs <2.0
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "deeplabcut>=3.0.0rc1",
    "aniposelib>=0.4.3",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "ruamel.yaml>=0.17.0",          # DLC-Dependency
    "xgboost>=3.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url  = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch       = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]
torchaudio  = [{ index = "pytorch-cu121" }]

[tool.uv]
index-strategy = "unsafe-best-match"
